<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualifications DMCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0e11;
    --bg-2: #101318;
    --surface: #15181e;
    --surface-2: #1b1f26;
    --border: #262b33;
    --border-soft: #1e222a;
    --text: #f2f0ea;
    --text-dim: #9aa1ac;
    --text-faint: #666d78;
    --accent: #c8303c;
    --accent-soft: rgba(200, 48, 60, 0.18);
    --accent-deep: #6e131c;
    --metal: #c9c9c9;
    --metal-soft: rgba(201, 201, 201, 0.14);
    --gold: #f4c463;
    --silver: #c9d1da;
    --bronze: #d99a63;
    --danger: #ff5c5c;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
  }

  body{
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(200,48,60,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(201,201,201,0.05), transparent 55%),
      var(--bg);
    padding: 28px 20px 60px;
  }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
  }

  header.topbar{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .brand-logo{
    height: 32px;
    width: auto;
    display: block;
  }

  .nav-bar{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .nav-sep{
    color: var(--text-faint);
    font-size: 16px;
  }

  /* Dropdowns de remplacement pour mobile (mêmes couleurs/police que les pilules) */
  .nav-select-row{
    display: none;
    gap: 10px;
    margin-bottom: 14px;
  }

  .nav-select{
    flex: 1 1 0;
    min-width: 0;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    background-color: var(--surface);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%239aa1ac' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 10px 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 32px 10px 16px;
    cursor: pointer;
  }

  .nav-select:focus{ outline: none; border-color: var(--accent); }

  #classSelect{ color: var(--accent); font-weight: 800; }

  .context-label{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--text-faint);
    margin: 0 0 10px;
  }

  .context-label strong{
    color: var(--accent);
    font-weight: 700;
  }

  .status{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    font-family: 'Rajdhani', sans-serif;
  }

  .live-pill{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 10px;
    border-radius: 999px;
    background: var(--metal-soft);
    border: 1px solid rgba(201,201,201,0.35);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--metal);
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }

  .live-pill.offline{
    background: rgba(255,92,92,0.12);
    border-color: rgba(255,92,92,0.35);
    color: var(--danger);
  }

  .live-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0 0 currentColor;
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse{
    0%   { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    70%  { box-shadow: 0 0 0 7px transparent; opacity: 0.6; }
    100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
  }

  .sync-time{
    font-size: 12px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .sync-time strong{
    color: var(--text-dim);
    font-weight: 600;
  }

  .table-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    /* no overflow:hidden here — it would break the sticky table header below */
  }

  thead tr:first-child th:first-child{ border-top-left-radius: 13px; }
  thead tr:first-child th:last-child{ border-top-right-radius: 13px; }
  tbody tr:last-child td:first-child{ border-bottom-left-radius: 13px; }
  tbody tr:last-child td:last-child{ border-bottom-right-radius: 13px; }

  .table-scroll{
    overflow-x: auto;
    overflow-y: auto;
    max-height: 72vh;
  }

  table{
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }

  thead th{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface-2);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: center;
    padding: 13px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  thead th.col-name{ text-align: left; padding-left: 18px; }
  thead th.col-run{ color: var(--accent); }

  tbody td{
    padding: 11px 10px;
    text-align: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--border-soft);
    color: var(--text);
    transition: color 0.2s ease;
  }

  tbody tr:last-child td{ border-bottom: none; }

  tbody tr:hover td{ background: rgba(255,255,255,0.02); }

  td.col-name{
    text-align: left;
    padding-left: 18px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
  }

  td.col-pos{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--text-dim);
  }

  td.col-run{
    font-weight: 800;
    font-size: 19px;
    color: var(--accent);
  }

  td.run-divider{
    border-left: 3px solid rgba(255, 255, 255, 0.16);
  }

  thead th.run-divider{
    border-left: 3px solid rgba(255, 255, 255, 0.16);
  }

  td.col-score{
    font-weight: 800;
    font-size: 19px;
    color: var(--text);
  }

  tr.rank-1 td.col-pos{ color: var(--gold); }
  tr.rank-2 td.col-pos{ color: var(--silver); }
  tr.rank-3 td.col-pos{ color: var(--bronze); }

  tr.rank-1{ box-shadow: inset 3px 0 0 0 var(--gold); }
  tr.rank-2{ box-shadow: inset 3px 0 0 0 var(--silver); }
  tr.rank-3{ box-shadow: inset 3px 0 0 0 var(--bronze); }

  /* Séparation visuelle entre la 12e et la 13e position */
  tr.tier-break td{
    border-top: 3px solid rgba(255, 255, 255, 0.2);
  }

  /* Pilotes non qualifiés (au-delà de la 16e position) */
  tr.not-qualified td{
    background: #0a0b0e;
    color: var(--text-faint);
  }
  tr.not-qualified td.col-pos,
  tr.not-qualified td.col-run,
  tr.not-qualified td.col-score{
    color: var(--text-faint);
  }
  tr.not-qualified:hover td{ background: #0a0b0e; }

  td.flash{
    animation: flashCell 1.3s ease-out;
    border-radius: 6px;
  }

  @keyframes flashCell{
    0%   { background: var(--accent-soft); }
    100% { background: transparent; }
  }

  .empty-state, .loading-state{
    padding: 60px 20px;
    text-align: center;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    letter-spacing: 0.03em;
  }

  footer{
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: var(--text-faint);
  }

  footer a{ color: var(--text-faint); }

  .switch{
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
  }

  .switch-btn{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 18px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    white-space: nowrap;
  }

  .switch-btn:hover{ color: var(--text); }

  .switch-class .switch-btn.active{
    background: var(--accent);
    color: #fff;
  }

  .switch-view{
    padding: 3px;
  }

  .switch-view .switch-btn{
    padding: 7px 16px;
    font-size: 12px;
  }

  .switch-view .switch-btn.active{
    background: var(--metal);
    color: #17181a;
  }

  @media (max-width: 640px){
    thead th, tbody td{ padding: 9px 7px; font-size: 13px; }
    td.col-name{ padding-left: 12px; }
    .switch{ flex-wrap: wrap; justify-content: center; }
    .switch-view .switch-btn{ padding: 7px 12px; font-size: 11px; }

    /* Boutons Pro/Pro-Am + onglets -> dropdowns, pour libérer de la hauteur */
    .nav-bar{ display: none; }
    .nav-select-row{ display: flex; }

    /* Signal "en direct" -> juste un point de couleur, sans texte ni pilule */
    .live-pill, .live-pill.offline{
      padding: 0;
      background: transparent;
      border: none;
      gap: 0;
    }
    .live-pill{ color: #34c759; }
    .live-pill #liveLabel{ display: none; }
    .live-dot{ width: 12px; height: 12px; }
  }

  .hidden{ display: none !important; }

  /* ---------- Bracket (Top 16) ---------- */
  .bracket-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 4px 26px;
  }

  .bracket-scroll{
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0 14px;
  }

  .bracket{
    display: flex;
    align-items: stretch;
    min-width: 1220px;
    padding-bottom: 6px;
  }

  .bside{ display: flex; align-items: stretch; }
  .bside.right{ flex-direction: row-reverse; }

  .bround{ display: flex; flex-direction: column; width: 172px; flex: none; }

  .bround-label{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    padding-bottom: 12px;
    white-space: nowrap;
  }

  .bcol{ flex: 1; display: flex; flex-direction: column; justify-content: space-around; }

  .bconn{ width: 22px; flex: none; display: flex; flex-direction: column; }
  .bconn .bround-label{ visibility: hidden; }
  .bconn-fill{ flex: 1; position: relative; }
  .conn-seg{ position: absolute; background: var(--border); }

  .match{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .entrant{
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    line-height: 1.25;
  }

  .entrant + .entrant{ border-top: 1px solid var(--border); }

  .entrant .seed{
    color: var(--text-faint);
    font-weight: 700;
    font-size: 11px;
    min-width: 14px;
    text-align: right;
    flex: none;
  }

  .entrant .pname{
    flex: 1;
    min-width: 0;
    color: var(--text-dim);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entrant.tbd .pname{ color: var(--text-faint); font-style: italic; font-weight: 500; }
  .entrant.winner{ background: rgba(200,48,60,0.09); }
  .entrant.winner .seed{ color: var(--accent); }
  .entrant.winner .pname{ color: var(--text); font-weight: 700; }
  .entrant.loser .pname{ opacity: 0.5; }
  .entrant.loser .seed{ opacity: 0.5; }

  .bcenter{
    flex: none;
    width: 208px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    padding: 0 20px;
  }

  .match-final{ border-color: var(--accent); box-shadow: 0 0 0 1px rgba(200,48,60,0.3); }
  .match-final .entrant{ font-size: 14px; padding: 10px 12px; }
  .match-final .entrant.winner{ background: rgba(200,48,60,0.16); }

  .third-label{ margin-top: 18px; }
  .match-third{ opacity: 0.92; }
  .match-third .entrant{ font-size: 12px; padding: 6px 10px; }

  .podium{
    margin-top: 18px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .podium-row{ display: flex; align-items: center; gap: 9px; padding: 5px 0; }
  .podium-row + .podium-row{ border-top: 1px solid var(--border-soft); }

  .podium-rank{
    width: 19px;
    height: 19px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 800;
    background: var(--surface-2);
    color: var(--text-faint);
    flex: none;
  }

  .podium-row.p1 .podium-rank{ background: var(--gold); color: #3a2a06; }
  .podium-row.p2 .podium-rank{ background: var(--silver); color: #22262c; }
  .podium-row.p3 .podium-rank{ background: var(--bronze); color: #3a2308; }

  .podium-name{
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .podium-row.p1 .podium-name{ color: var(--text); font-weight: 700; }

  .flash-glow{ animation: flashGlow 1.3s ease-out; border-radius: 6px; }
  @keyframes flashGlow{
    0%   { box-shadow: 0 0 0 2px var(--accent-soft); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* Bandeau "pilote en piste" — feuille "qualifs" du sheet dmcc info live */
  .ontrack-banner{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 16px;
    background: linear-gradient(90deg, var(--accent-soft), transparent 85%);
    border: 1px solid var(--accent-deep);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 12px 18px;
    margin: 0 0 16px;
    font-family: 'Rajdhani', sans-serif;
  }

  .ontrack-live-dot{
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 1.8s ease-out infinite;
  }

  .ontrack-label{
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--accent);
  }

  .ontrack-num{
    font-weight: 800;
    font-size: 20px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .ontrack-name{
    font-weight: 700;
    font-size: 20px;
    color: var(--text);
  }

  .ontrack-class{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    text-transform: uppercase;
  }

  .ontrack-run{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-left: auto;
  }

  .ontrack-champ{
    font-size: 13px;
    color: var(--text-dim);
  }

  .ontrack-champ strong{ color: var(--gold); font-size: 15px; }

  /* Bandeau "battle en cours" — feuille "battle" du sheet dmcc info live (vue Top 16) */
  .battle-round{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .battle-vs{
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1 1 auto;
    justify-content: center;
  }

  .battle-driver{
    font-weight: 700;
    font-size: 20px;
    color: var(--text);
  }

  .battle-vs-sep{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  @media (max-width: 640px){
    .ontrack-banner{ padding: 10px 14px; gap: 8px 12px; }
    .ontrack-num, .ontrack-name{ font-size: 16px; }
    .ontrack-run{ margin-left: 0; }
    .battle-driver{ font-size: 16px; }
    .battle-vs{ gap: 8px; }
  }

  /* ---------- Vue "Annonceurs" : stats + commanditaires ---------- */
  .sponsor-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .sponsor-mode-switch{ margin-bottom: 18px; }
  .sponsor-mode-switch .switch-btn.active{ background: var(--accent); color: #fff; }

  .sponsor-empty{
    padding: 50px 20px;
    text-align: center;
    color: var(--text-faint);
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.04em;
  }

  /* Boite pilote — meme esthetique que le bandeau "en piste" */
  .driver-box{
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: linear-gradient(90deg, var(--accent-soft), transparent 85%);
    border: 1px solid var(--accent-deep);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 16px 18px;
    font-family: 'Rajdhani', sans-serif;
  }

  .driver-box-head{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
  }

  .driver-box-stats{
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
  }

  .driver-box-stats strong{
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .sponsor-list-title{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 2px 0 2px;
    font-family: 'Rajdhani', sans-serif;
  }

  .sponsor-tags{ display: flex; flex-wrap: wrap; gap: 6px; }

  .sponsor-tag{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .battle-profiles{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 22px;
    align-items: start;
  }

  .battle-profiles .vs-divider{
    font-family: 'Rajdhani', sans-serif;
    font-weight: 800;
    color: var(--accent);
    font-size: 15px;
    letter-spacing: 0.08em;
    align-self: center;
    padding-top: 30px;
  }

  @media (max-width: 760px){
    .battle-profiles{ grid-template-columns: 1fr; }
    .battle-profiles .vs-divider{ padding-top: 0; text-align: center; }
  }

  @media (max-width: 640px){
    .sponsor-card{ padding: 16px; }
    .driver-box{ padding: 12px 14px; }
  }
</style>
</head>
<body>

<script>
(function(){
  var CLASSES = {
    pro:   { label: 'Pro',    eyebrow: 'PRO',    sheetId: '1LAD88_Qo7LUDN3iwZQETimuKv2PhmE1RnsZxkUET2Po' },
    proam: { label: 'Pro-Am', eyebrow: 'PRO-AM', sheetId: '1XlKbpz2R4B4bj1GJLLFrqDqOWuwdHnzgq84xPD8B6Ac' }
  };
  var VIEWS = {
    quali:    { label: 'Qualification Rank' },
    scoring:  { label: 'Qualification Sheet' },
    lcq:      { label: 'Qualif LCQ' },
    top16:    { label: 'Top 16 Bracket' },
    sponsors: { label: 'Annonceurs' }
  };
  var POLL_MS = 3000;
  var FETCH_TIMEOUT_MS = 9000;

  // Sheet "dmcc info live" — onglet "qualifs" : indicateur du pilote actuellement en piste
  // (numero, Driver, Championnat, run, classe, ...), rempli/maintenu par Cedric côté Sheets.
  var LIVE_SHEET_ID = '1yvpVAKQPRgzBOxSnZT9rpxXk18Nih0lm6OuDWdkA5ls';
  var LIVE_SHEET_TAB = 'qualifs';

  function parseHash(){
    var parts = location.hash.replace('#', '').split('-');
    return {
      cls:  CLASSES[parts[0]] ? parts[0] : 'pro',
      view: VIEWS[parts[1]] ? parts[1] : 'quali'
    };
  }

  var initial = parseHash();
  var currentClassId = initial.cls;
  var currentViewId = initial.view;
  var activeGen = 0;
  var pollTimer = null;

  var qualifsRows = null;   // [{pos, num, name, score, style, angle, line}]
  var scoringRows = null;   // [{num, name, styleR1, angleR1, lineR1, run1, styleR2, angleR2, lineR2, run2}]
  var scoringMap = null;    // Map<num, {run1, run2}> — used to merge Run 1/2 into the Qualification view
  var prevQuali = {};       // num -> last rendered fields (Qualification view), for flash-on-change
  var prevScoring = {};     // num -> last rendered fields (Scoring view), for flash-on-change
  var top16Rows = null;     // parsed bracket structure, or false if the Top16 tab is unavailable
  var prevTop16 = {};       // cell key -> last rendered signature, for flash-on-change
  var lcqRows = null;       // [{ordre, num, name}] — feuille "Ordre qualif run #2"
  var prevLcq = {};         // num -> last rendered fields (Qualif LCQ view), for flash-on-change
  var onTrack = null;       // {num, name, champ, run, classe} — pilote en piste, ou false si aucun
  var prevOnTrack = null;   // dernier pilote affiché, pour le flash au changement
  var battleInfo = null;    // {bracket, d1, d2} — battle Top16 en cours, ou false si aucune
  var prevBattle = null;    // dernière battle affichée, pour le flash au changement
  var statsData = null;     // [{name, num, podiums, battles, wins, winPct, manufacturer, car, power, classe, champ}]
  var statsByNum = {};      // Map<num, statsRow>
  var sponsorsByNum = null; // Map<num, [sponsor, ...]> — feuille "site"
  var currentSponsorMode = 'qualif'; // 'qualif' | 'battle' — vue "Annonceurs"
  var jsonpSeq = 0;

  function cellVal(cell){
    if (!cell) return '';
    if (cell.f !== undefined && cell.f !== null && cell.f !== '') return cell.f;
    if (cell.v !== undefined && cell.v !== null) return cell.v;
    return '';
  }

  function gvizUrl(sheetId, sheetName, callbackName, headerRows){
    var tqx = 'out:json;responseHandler:' + callbackName;
    return 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq'
      + '?sheet=' + encodeURIComponent(sheetName)
      + '&headers=' + (headerRows === undefined ? 1 : headerRows)
      + '&tqx=' + encodeURIComponent(tqx)
      + '&_=' + Date.now();
  }

  function jsonpFetch(sheetId, sheetName, headerRows){
    return new Promise(function(resolve, reject){
      jsonpSeq += 1;
      var cbName = '__dmccCb_' + jsonpSeq;
      var settled = false;

      var timer = setTimeout(function(){
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('timeout'));
      }, FETCH_TIMEOUT_MS);

      function cleanup(){
        clearTimeout(timer);
        delete window[cbName];
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function(resp){
        if (settled) return;
        settled = true;
        cleanup();
        resolve(resp);
      };

      var script = document.createElement('script');
      script.src = gvizUrl(sheetId, sheetName, cbName, headerRows);
      script.onerror = function(){
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error('script-error'));
      };
      document.head.appendChild(script);
    });
  }

  function parseQualifs(resp){
    if (!resp || resp.status !== 'ok' || !resp.table) return [];
    var rows = resp.table.rows || [];
    var out = [];
    for (var i = 0; i < rows.length; i++){
      var c = (rows[i] && rows[i].c) || [];
      var name = cellVal(c[3]);
      if (!String(name).trim()) continue;
      out.push({
        pos:   String(cellVal(c[0])).trim(),
        num:   String(cellVal(c[2])).trim(),
        name:  String(name).trim(),
        score: String(cellVal(c[4])).trim(),
        style: String(cellVal(c[5])).trim(),
        angle: String(cellVal(c[6])).trim(),
        line:  String(cellVal(c[7])).trim()
      });
    }
    return out;
  }

  // Feuille "Ordre qualif run #2" — ordre de passage pour le LCQ : colonnes A,B,C
  function parseLcq(resp){
    if (!resp || resp.status !== 'ok' || !resp.table) return [];
    var rows = resp.table.rows || [];
    var out = [];
    for (var i = 0; i < rows.length; i++){
      var c = (rows[i] && rows[i].c) || [];
      var name = cellVal(c[2]);
      if (!String(name).trim()) continue;
      out.push({
        ordre: String(cellVal(c[0])).trim(),
        num:   String(cellVal(c[1])).trim(),
        name:  String(name).trim()
      });
    }
    return out;
  }

  // Sheet "dmcc info live", onglet "qualifs" — une seule ligne vivante décrivant le pilote
  // actuellement en piste. Colonnes : A numero, B Driver, C Championnat, D run, E classe.
  function parseOnTrack(resp){
    if (!resp || resp.status !== 'ok' || !resp.table) return null;
    var rows = resp.table.rows || [];
    var c = (rows[0] && rows[0].c) || [];
    var name = cellVal(c[1]);
    if (!String(name).trim()) return null;
    return {
      num:    String(cellVal(c[0])).trim(),
      name:   String(name).trim(),
      champ:  String(cellVal(c[2])).trim(),
      run:    String(cellVal(c[3])).trim(),
      classe: String(cellVal(c[4])).trim()
    };
  }

  // "20" -> "20e", "1" -> "1er" (ordinaux français simples)
  function ordinalFr(v){
    var s = String(v || '').trim();
    if (!/^\d+$/.test(s)) return s || '—';
    return s === '1' ? '1er' : s + 'e';
  }

  // Sheet "dmcc info live", onglet "battle" — la battle Top16 en cours.
  // Colonne A : nom du bracket (ligne 2). Colonne C : nom des 2 drivers (lignes 2 et 3).
  function parseBattle(resp){
    if (!resp || resp.status !== 'ok' || !resp.table) return null;
    var rows = resp.table.rows || [];
    var r0 = (rows[0] && rows[0].c) || [];
    var r1 = (rows[1] && rows[1].c) || [];
    var d1 = String(cellVal(r0[2]) || '').trim();
    var d2 = String(cellVal(r1[2]) || '').trim();
    if (!d1 && !d2) return null;
    return {
      bracket: String(cellVal(r0[0]) || '').trim(),
      d1: d1,
      d2: d2
    };
  }

  // Sheet "dmcc info live", onglet "Stats" — une ligne par pilote, statistiques de carrière.
  // Colonnes : Driver, Numero, Podiums, Overall Battles, Overall Battle Wins, Battle Win %,
  // Manufacture, Cars, Power, classe, photo, [championnat] (12e colonne optionnelle).
  function parseStatsData(resp){
    if (!resp || resp.status !== 'ok' || !resp.table) return [];
    var rows = resp.table.rows || [];
    var out = [];
    for (var i = 0; i < rows.length; i++){
      var c = (rows[i] && rows[i].c) || [];
      var name = cellVal(c[0]);
      if (!String(name).trim()) continue;
      out.push({
        name:         String(name).trim(),
        num:          String(cellVal(c[1]) || '').trim(),
        podiums:      String(cellVal(c[2]) || '').trim(),
        battles:      String(cellVal(c[3]) || '').trim(),
        wins:         String(cellVal(c[4]) || '').trim(),
        winPct:       String(cellVal(c[5]) || '').trim(),
        manufacturer: String(cellVal(c[6]) || '').trim(),
        car:          String(cellVal(c[7]) || '').trim(),
        power:        String(cellVal(c[8]) || '').trim(),
        classe:       String(cellVal(c[9]) || '').trim(),
        champ:        String(cellVal(c[11]) || '').trim()
      });
    }
    return out;
  }

  function buildStatsByNum(rows){
    var map = {};
    for (var i = 0; i < rows.length; i++){
      if (rows[i].num) map[rows[i].num] = rows[i];
    }
    return map;
  }

  // Sheet "dmcc info live", onglet "site" — commanditaires par numéro de pilote.
  // Colonnes : post_title, driver_name, nationality, car_photo, profile_picture,
  // class, number, car_model, power, sponsor (liste séparée par des sauts de ligne).
  function parseSiteSponsors(resp){
    if (!resp || resp.status !== 'ok' || !resp.table) return {};
    var rows = resp.table.rows || [];
    var map = {};
    for (var i = 0; i < rows.length; i++){
      var c = (rows[i] && rows[i].c) || [];
      var num = String(cellVal(c[6]) || '').trim();
      if (!num) continue;
      var raw = cellVal(c[9]);
      var list = String(raw || '').split(/\r?\n/).map(function(s){ return s.trim(); })
        .filter(function(s){ return s && s !== '-'; });
      map[num] = list;
    }
    return map;
  }

  // Normalisation pour le matching de noms (accents, casse, ponctuation) — la feuille
  // "battle" ne contient que des noms (pas de numéro), donc on doit les rapprocher des
  // noms de la feuille "Stats" du mieux possible.
  function normName(s){
    return String(s || '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/['".]/g, '')
      .replace(/-/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function findStatsByName(name){
    var n = normName(name);
    if (!n || !statsData) return null;
    for (var i = 0; i < statsData.length; i++){
      if (normName(statsData[i].name) === n) return statsData[i];
    }
    var parts = n.split(' ');
    var surname = parts[parts.length - 1];
    var initial = parts[0] ? parts[0][0] : '';
    for (var j = 0; j < statsData.length; j++){
      var rparts = normName(statsData[j].name).split(' ');
      var rsurname = rparts[rparts.length - 1];
      if (rsurname === surname && rparts[0] && rparts[0][0] === initial) return statsData[j];
    }
    if (surname.length > 2){
      for (var k = 0; k < statsData.length; k++){
        if (normName(statsData[k].name).indexOf(surname) !== -1) return statsData[k];
      }
    }
    return null;
  }

  // Assemble le profil complet (stats + commanditaires) d'un pilote pour la vue "Annonceurs".
  // num connu (mode Qualif, exact) ou seulement un nom (mode Battle, matching approximatif).
  function buildDriverProfile(num, name, extra){
    extra = extra || {};
    var stats = (num && statsByNum[num]) || findStatsByName(name);
    var resolvedNum = (stats && stats.num) || num || '';
    var sponsors = (sponsorsByNum && resolvedNum && sponsorsByNum[resolvedNum]) || [];
    return {
      name: name,
      num: resolvedNum,
      classe: (stats && stats.classe) || extra.classe || '',
      champ: extra.champ || (stats && stats.champ) || '',
      run: extra.run || '',
      podiums: stats ? stats.podiums : '',
      battles: stats ? stats.battles : '',
      wins: stats ? stats.wins : '',
      winPct: stats ? stats.winPct : '',
      manufacturer: stats ? stats.manufacturer : '',
      car: stats ? stats.car : '',
      power: stats ? stats.power : '',
      sponsors: sponsors
    };
  }

  // Full "scoring" sheet rows: columns B,C,D,E,F,H,I,J,K,M
  function parseScoringRows(resp){
    if (!resp || resp.status !== 'ok' || !resp.table) return [];
    var rows = resp.table.rows || [];
    var out = [];
    for (var i = 0; i < rows.length; i++){
      var c = (rows[i] && rows[i].c) || [];
      var name = cellVal(c[2]);
      if (!String(name).trim()) continue;
      out.push({
        num:     String(cellVal(c[1])).trim(),
        name:    String(name).trim(),
        styleR1: String(cellVal(c[3])).trim(),
        angleR1: String(cellVal(c[4])).trim(),
        lineR1:  String(cellVal(c[5])).trim(),
        run1:    String(cellVal(c[7])).trim(),
        styleR2: String(cellVal(c[8])).trim(),
        angleR2: String(cellVal(c[9])).trim(),
        lineR2:  String(cellVal(c[10])).trim(),
        run2:    String(cellVal(c[12])).trim()
      });
    }
    return out;
  }

  function buildScoringMap(rows){
    var map = {};
    for (var i = 0; i < rows.length; i++){
      map[rows[i].num] = { run1: rows[i].run1, run2: rows[i].run2 };
    }
    return map;
  }

  // ---------- Feuille "Top16" : tableau à élimination directe ----------
  // La feuille encode le bracket de façon spatiale (pas des colonnes tabulaires).
  // Ce gabarit fixe (rowTop, rowBot, colName, colFlag) — identique pour Pro et Pro-Am —
  // a été établi en inspectant les feuilles réelles cellule par cellule.
  var TOP16_TEMPLATE = {
    top16Left:   [ [2,4,1,0], [10,12,1,0], [16,18,1,0], [27,29,1,0] ],
    top16Right:  [ [2,4,13,14], [10,12,13,14], [16,18,13,14], [27,29,13,14] ],
    top8Left:    [ [5,7,3,2], [22,24,3,2] ],
    top8Right:   [ [5,7,11,12], [22,24,11,12] ],
    final4Left:  [ [13,15,5,4] ],
    final4Right: [ [13,15,9,10] ],
    finalMatch:  [10,12,6,8],
    thirdMatch:  [19,21,6,8],
    resultRows:  [25,26,27,28]
  };

  function top16Cell(table, r, c){
    var row = table.rows[r];
    if (!row || !row.c) return '';
    return String(cellVal(row.c[c]) == null ? '' : cellVal(row.c[c])).trim();
  }

  function top16IsWin(v){
    return v === true || /^(true|vrai)$/i.test(String(v).trim());
  }

  function top16SplitName(raw){
    var m = String(raw || '').match(/^(\d+)\s*-\s*(.+)$/);
    return m ? { seed: m[1], name: m[2].trim() } : { seed: '', name: String(raw || '').trim() };
  }

  function top16Entrant(table, row, nameCol, flagCol){
    var raw = top16Cell(table, row, nameCol);
    var flagRaw = top16Cell(table, row, flagCol);
    var sn = top16SplitName(raw);
    return {
      key: row + ':' + nameCol,
      raw: raw,
      seed: sn.seed,
      name: sn.name,
      winner: flagRaw === '' ? null : top16IsWin(flagRaw)
    };
  }

  function top16Match(table, def){
    return {
      top: top16Entrant(table, def[0], def[2], def[3]),
      bottom: top16Entrant(table, def[1], def[2], def[3])
    };
  }

  function parseTop16(resp){
    if (!resp || resp.status !== 'ok' || !resp.table || !resp.table.rows) return false;
    var t = resp.table;
    var d = TOP16_TEMPLATE;

    function matches(list){
      var out = [];
      for (var i = 0; i < list.length; i++) out.push(top16Match(t, list[i]));
      return out;
    }

    var resultRows = [];
    for (var r = 0; r < d.resultRows.length; r++){
      var rr = d.resultRows[r];
      resultRows.push({
        key: 'result' + r,
        rank: top16Cell(t, rr, 6),
        name: top16Cell(t, rr, 7)
      });
    }

    return {
      top16Left:   matches(d.top16Left),
      top16Right:  matches(d.top16Right),
      top8Left:    matches(d.top8Left),
      top8Right:   matches(d.top8Right),
      final4Left:  matches(d.final4Left),
      final4Right: matches(d.final4Right),
      finalMatch:  top16Match(t, d.finalMatch),
      thirdMatch:  top16Match(t, d.thirdMatch),
      resultRows:  resultRows
    };
  }

  function addConnSeg(container, style){
    var el = document.createElement('div');
    el.className = 'conn-seg';
    for (var k in style) el.style[k] = style[k];
    container.appendChild(el);
  }

  // Dessine les connecteurs entre un tour de n matchs et le suivant (n/2 matchs).
  // dir 'l' : les matchs "source" sont à gauche du connecteur (bracket de gauche).
  // dir 'r' : les matchs "source" sont à droite du connecteur (bracket de droite, miroir).
  function buildConnFill(el, n, dir){
    el.innerHTML = '';
    var pairs = n / 2;
    var fromSide = (dir === 'l') ? { left: '0', right: '50%' } : { left: '50%', right: '0' };
    var toSide   = (dir === 'l') ? { left: '50%', right: '0' } : { left: '0', right: '50%' };
    for (var p = 0; p < pairs; p++){
      var c1 = ((2 * p + 0.5) / n) * 100;
      var c2 = ((2 * p + 1.5) / n) * 100;
      var mid = (c1 + c2) / 2;
      addConnSeg(el, { top: c1 + '%', height: '2px', left: fromSide.left, right: fromSide.right });
      addConnSeg(el, { top: c2 + '%', height: '2px', left: fromSide.left, right: fromSide.right });
      addConnSeg(el, { top: Math.min(c1, c2) + '%', height: Math.abs(c2 - c1) + '%', width: '2px', left: 'calc(50% - 1px)' });
      addConnSeg(el, { top: mid + '%', height: '2px', left: toSide.left, right: toSide.right });
    }
  }

  function buildConnStub(el){
    el.innerHTML = '';
    addConnSeg(el, { top: '50%', height: '2px', left: '0', right: '0' });
  }

  function renderTop16(){
    var wrap = document.getElementById('bracketBody');
    var prevScrollEl = wrap.querySelector('.bracket-scroll');
    var prevScrollLeft = prevScrollEl ? prevScrollEl.scrollLeft : 0;

    if (top16Rows === null){
      wrap.innerHTML = '<div class="loading-state">Chargement du tableau…</div>';
      return;
    }
    if (top16Rows === false){
      wrap.innerHTML = '<div class="empty-state">Tableau Top 16 non disponible pour le moment.</div>';
      return;
    }

    var d = top16Rows;
    var nextPrev = {};

    function markChanged(key, sig){
      var prev = prevTop16[key];
      nextPrev[key] = sig;
      return prev !== undefined && prev !== sig;
    }

    function entrantHtml(e){
      var cls = 'entrant';
      if (!e.raw) cls += ' tbd';
      else if (e.winner === true) cls += ' winner';
      else if (e.winner === false) cls += ' loser';
      if (markChanged(e.key, e.raw + '|' + e.winner)) cls += ' flash-glow';
      var label = e.raw ? escapeHtml(e.name) : 'À déterminer';
      var seed = e.seed ? escapeHtml(e.seed) : '';
      return '<div class="' + cls + '"><span class="seed">' + seed + '</span><span class="pname">' + label + '</span></div>';
    }

    function matchHtml(m, extraCls){
      return '<div class="match' + (extraCls ? ' ' + extraCls : '') + '">' + entrantHtml(m.top) + entrantHtml(m.bottom) + '</div>';
    }

    function colHtml(list){
      var h = '';
      for (var i = 0; i < list.length; i++) h += matchHtml(list[i]);
      return h;
    }

    function podiumHtml(rows){
      var any = false;
      for (var i = 0; i < rows.length; i++){ if (rows[i].name) any = true; }
      if (!any) return '';
      var h = '<div class="podium">';
      for (var i = 0; i < rows.length; i++){
        var row = rows[i];
        var rankNum = parseInt(row.rank, 10) || (i + 1);
        var pcls = 'podium-row' + (rankNum >= 1 && rankNum <= 3 ? ' p' + rankNum : '');
        if (markChanged(row.key, row.name)) pcls += ' flash-glow';
        var sn = top16SplitName(row.name);
        h += '<div class="' + pcls + '">' +
          '<span class="podium-rank">' + rankNum + '</span>' +
          '<span class="seed">' + escapeHtml(sn.seed) + '</span>' +
          '<span class="podium-name">' + (row.name ? escapeHtml(sn.name) : 'À déterminer') + '</span>' +
        '</div>';
      }
      h += '</div>';
      return h;
    }

    var html =
      '<div class="bracket-scroll"><div class="bracket">' +
        '<div class="bside">' +
          '<div class="bround"><div class="bround-label">Top 16</div><div class="bcol">' + colHtml(d.top16Left) + '</div></div>' +
          '<div class="bconn"><div class="bround-label">&nbsp;</div><div class="bconn-fill" id="conn-t16l"></div></div>' +
          '<div class="bround"><div class="bround-label">Top 8</div><div class="bcol">' + colHtml(d.top8Left) + '</div></div>' +
          '<div class="bconn"><div class="bround-label">&nbsp;</div><div class="bconn-fill" id="conn-t8l"></div></div>' +
          '<div class="bround"><div class="bround-label">Demi-finale</div><div class="bcol">' + colHtml(d.final4Left) + '</div></div>' +
          '<div class="bconn"><div class="bround-label">&nbsp;</div><div class="bconn-fill" id="conn-f4l"></div></div>' +
        '</div>' +
        '<div class="bcenter">' +
          '<div class="bround-label">Finale</div>' +
          matchHtml(d.finalMatch, 'match-final') +
          '<div class="bround-label third-label">3e place</div>' +
          matchHtml(d.thirdMatch, 'match-third') +
          podiumHtml(d.resultRows) +
        '</div>' +
        '<div class="bside right">' +
          '<div class="bround"><div class="bround-label">Top 16</div><div class="bcol">' + colHtml(d.top16Right) + '</div></div>' +
          '<div class="bconn"><div class="bround-label">&nbsp;</div><div class="bconn-fill" id="conn-t16r"></div></div>' +
          '<div class="bround"><div class="bround-label">Top 8</div><div class="bcol">' + colHtml(d.top8Right) + '</div></div>' +
          '<div class="bconn"><div class="bround-label">&nbsp;</div><div class="bconn-fill" id="conn-t8r"></div></div>' +
          '<div class="bround"><div class="bround-label">Demi-finale</div><div class="bcol">' + colHtml(d.final4Right) + '</div></div>' +
          '<div class="bconn"><div class="bround-label">&nbsp;</div><div class="bconn-fill" id="conn-f4r"></div></div>' +
        '</div>' +
      '</div></div>';

    wrap.innerHTML = html;
    prevTop16 = nextPrev;

    buildConnStub(document.getElementById('conn-f4l'));
    buildConnFill(document.getElementById('conn-t8l'), 2, 'l');
    buildConnFill(document.getElementById('conn-t16l'), 4, 'l');
    buildConnStub(document.getElementById('conn-f4r'));
    buildConnFill(document.getElementById('conn-t8r'), 2, 'r');
    buildConnFill(document.getElementById('conn-t16r'), 4, 'r');

    var scrollEl = wrap.querySelector('.bracket-scroll');
    if (scrollEl) scrollEl.scrollLeft = prevScrollLeft;
  }

  function setLive(ok){
    var pill = document.getElementById('livePill');

    if (ok){

  function fieldsFor(row){
    var s = (scoringMap && scoringMap[row.num]) || {};
    return {
      pos: row.pos, num: row.num, name: row.name,
      score: row.score, style: row.style, angle: row.angle, line: row.line,
      run1: (s.run1 !== undefined && s.run1 !== '') ? s.run1 : '—',
      run2: (s.run2 !== undefined && s.run2 !== '') ? s.run2 : '—'
    };
  }

  function renderOnTrackBanner(){

  function driverProfileHtml(p){
    var html = '<div class="driver-box">';
    html += '<div class="driver-box-head">';
    if (p.num) html += '<span class="ontrack-num">#' + escapeHtml(p.num) + '</span>';
    html += '<span class="ontrack-name">' + escapeHtml(p.name) + '</span>';

    var vehicule = [p.manufacturer, p.car].filter(function(x){ return x; }).join(' ');
    if (vehicule) stats.push('Véhicule : <strong>' + escapeHtml(vehicule) + '</strong>');
    if (p.power) stats.push('Puissance : <strong>' + escapeHtml(p.power) + ' hp</strong>');
    html += '<div class="driver-box-stats">' + stats.join(' &nbsp;·&nbsp; ') + '</div>';
    html += '</div>';
    return html;
  }

      if (!battleInfo){
        body.innerHTML = '<div class="sponsor-empty">Aucune battle en cours pour le moment.</div>';

  function renderQuali(){
    var thead = document.getElementById('thead');
    var tbody = document.getElementById('tbody');

    thead.innerHTML =
      '<tr>' +
        '<th class="col-pos">Pos</th>' +
        '<th>#</th>' +
        '<th class="col-name">Pilote</th>' +
        '<th>Score</th>' +
        '<th>Style</th>' +
        '<th>Angle</th>' +
        '<th>Ligne</th>' +
        '<th class="col-run run-divider">Run 1</th>' +
        '<th class="col-run">Run 2</th>' +
      '</tr>';

    if (qualifsRows === null){
      tbody.innerHTML = '<tr><td colspan="9"><div class="loading-state">Chargement des données…</div></td></tr>';
      return;
    }
    if (!qualifsRows.length){
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state">Aucun pilote trouvé pour le moment.</div></td></tr>';
      return;
    }

    var keys = ['pos','num','name','score','style','angle','line','run1','run2'];
    var html = '';
    var nextPrev = {};

    for (var i = 0; i < qualifsRows.length; i++){
      var f = fieldsFor(qualifsRows[i]);
      nextPrev[f.num] = f;
      var prev = prevQuali[f.num];

      var posNum = parseInt(f.pos, 10);
      var rowClasses = ['row'];
      if (posNum === 1) rowClasses.push('rank-1');
      else if (posNum === 2) rowClasses.push('rank-2');
      else if (posNum === 3) rowClasses.push('rank-3');
      if (posNum === 13) rowClasses.push('tier-break');
      if (posNum > 16) rowClasses.push('not-qualified');

      html += '<tr class="' + rowClasses.join(' ') + '">';
      for (var k = 0; k < keys.length; k++){
        var key = keys[k];
        var val = f[key];
        var changed = prev && String(prev[key]) !== String(val);
        var cls = '';
        if (key === 'name') cls = 'col-name';
        else if (key === 'pos') cls = 'col-pos';
        else if (key === 'score') cls = 'col-score';
        else if (key === 'run1' || key === 'run2') cls = 'col-run';
        if (key === 'run1') cls = (cls ? cls + ' ' : '') + 'run-divider';
        if (changed) cls = (cls ? cls + ' ' : '') + 'flash';
        html += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + escapeHtml(val) + '</td>';
      }
      html += '</tr>';
    }

    tbody.innerHTML = html;
    prevQuali = nextPrev;
  }

  // Vue "Scoring" — feed brut pour les annonceurs : colonnes B,C,D,E,F,H,I,J,K,M de la feuille scoring
  function renderScoring(){
    var thead = document.getElementById('thead');
    var tbody = document.getElementById('tbody');

    thead.innerHTML =
      '<tr>' +
        '<th class="col-pos" style="width:56px">Ordre</th>' +
        '<th>#</th>' +
        '<th class="col-name">Pilote</th>' +
        '<th class="col-pos">Position</th>' +
        '<th class="run-divider">Style</th>' +
        '<th>Angle</th>' +
        '<th>Ligne</th>' +
        '<th class="col-run">Run 1</th>' +
        '<th class="run-divider">Style</th>' +
        '<th>Angle</th>' +
        '<th>Ligne</th>' +
        '<th class="col-run">Run 2</th>' +
      '</tr>';

    if (scoringRows === null){
      tbody.innerHTML = '<tr><td colspan="12"><div class="loading-state">Chargement des données…</div></td></tr>';
      return;
    }
    if (!scoringRows.length){
      tbody.innerHTML = '<tr><td colspan="12"><div class="empty-state">Aucun pilote trouvé pour le moment.</div></td></tr>';
      return;
    }

    // Position de qualification (feuille Qualifs), jumelée par numéro de pilote — pour le contexte des annonceurs
    var qualifPosByNum = {};
    if (qualifsRows){
      for (var q = 0; q < qualifsRows.length; q++){
        qualifPosByNum[qualifsRows[q].num] = qualifsRows[q].pos;
      }
    }

    var keys = ['ordre','num','name','qualifPos','styleR1','angleR1','lineR1','run1','styleR2','angleR2','lineR2','run2'];
    var html = '';
    var nextPrev = {};

    for (var i = 0; i < scoringRows.length; i++){
      var raw = scoringRows[i];
      var f = {
        ordre: i + 1, num: raw.num, name: raw.name,
        qualifPos: qualifPosByNum[raw.num] || '—',
        styleR1: raw.styleR1, angleR1: raw.angleR1, lineR1: raw.lineR1, run1: raw.run1,
        styleR2: raw.styleR2, angleR2: raw.angleR2, lineR2: raw.lineR2, run2: raw.run2
      };
      nextPrev[f.num] = f;
      var prev = prevScoring[f.num];

      html += '<tr class="row">';
      for (var k = 0; k < keys.length; k++){
        var key = keys[k];
        var val = f[key];
        var changed = prev && String(prev[key]) !== String(val);
        var cls = '';
        if (key === 'name') cls = 'col-name';
        else if (key === 'run1' || key === 'run2') cls = 'col-run';
        else if (key === 'qualifPos' || key === 'ordre') cls = 'col-pos';
        if (key === 'styleR1' || key === 'styleR2') cls = (cls ? cls + ' ' : '') + 'run-divider';
        if (changed) cls = (cls ? cls + ' ' : '') + 'flash';
        html += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + escapeHtml(val) + '</td>';
      }
      html += '</tr>';
    }

    tbody.innerHTML = html;
    prevScoring = nextPrev;
  }

  // Vue "Qualif LCQ" — ordre de passage pour la reprise (feuille "Ordre qualif run #2"),
  // jumelée avec les données de la feuille "scoring" (par numéro de pilote) pour donner
  // tout le contexte de qualification directement à côté du nom.
  function renderLcq(){
    var thead = document.getElementById('thead');
    var tbody = document.getElementById('tbody');

    thead.innerHTML =
      '<tr>' +
        '<th class="col-pos" style="width:60px">Ordre</th>' +
        '<th style="width:50px">#</th>' +
        '<th class="col-name">Pilote</th>' +
        '<th class="col-pos">Position</th>' +
        '<th class="run-divider">Style</th>' +
        '<th>Angle</th>' +
        '<th>Ligne</th>' +
        '<th class="col-run">Run 1</th>' +
        '<th class="run-divider">Style</th>' +
        '<th>Angle</th>' +
        '<th>Ligne</th>' +
        '<th class="col-run">Run 2</th>' +
      '</tr>';

    if (lcqRows === null){
      tbody.innerHTML = '<tr><td colspan="12"><div class="loading-state">Chargement des données…</div></td></tr>';
      return;
    }
    if (!lcqRows.length){
      tbody.innerHTML = '<tr><td colspan="12"><div class="empty-state">Aucun pilote trouvé pour le moment.</div></td></tr>';
      return;
    }

    // Position de qualification (feuille Qualifs) et détails de run (feuille scoring),
    // jumelés par numéro de pilote.
    var qualifPosByNum = {};
    if (qualifsRows){
      for (var q = 0; q < qualifsRows.length; q++){
        qualifPosByNum[qualifsRows[q].num] = qualifsRows[q].pos;
      }
    }
    var scoringByNum = {};
    if (scoringRows){
      for (var s = 0; s < scoringRows.length; s++){
        scoringByNum[scoringRows[s].num] = scoringRows[s];
      }
    }

    var keys = ['ordre', 'num', 'name', 'qualifPos', 'styleR1', 'angleR1', 'lineR1', 'run1', 'styleR2', 'angleR2', 'lineR2', 'run2'];
    var html = '';
    var nextPrev = {};

    for (var i = 0; i < lcqRows.length; i++){
      var row = lcqRows[i];
      var sc = scoringByNum[row.num] || {};
      var f = {
        ordre: row.ordre, num: row.num, name: row.name,
        qualifPos: qualifPosByNum[row.num] || '—',
        styleR1: sc.styleR1 || '—', angleR1: sc.angleR1 || '—', lineR1: sc.lineR1 || '—', run1: sc.run1 || '—',
        styleR2: sc.styleR2 || '—', angleR2: sc.angleR2 || '—', lineR2: sc.lineR2 || '—', run2: sc.run2 || '—'
      };
      nextPrev[f.num] = f;
      var prev = prevLcq[f.num];

      html += '<tr class="row">';
      for (var k = 0; k < keys.length; k++){
        var key = keys[k];
        var val = f[key];
        var changed = prev && String(prev[key]) !== String(val);
        var cls = '';
        if (key === 'name') cls = 'col-name';
        else if (key === 'ordre' || key === 'qualifPos') cls = 'col-pos';
        else if (key === 'run1' || key === 'run2') cls = 'col-run';
        if (key === 'styleR1' || key === 'styleR2') cls = (cls ? cls + ' ' : '') + 'run-divider';
        if (changed) cls = (cls ? cls + ' ' : '') + 'flash';
        html += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + escapeHtml(val) + '</td>';
      }
      html += '</tr>';
    }

    tbody.innerHTML = html;
    prevLcq = nextPrev;
  }

  function escapeHtml(v){
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function pollOnce(){
    var gen = activeGen;
    var sheetId = CLASSES[currentClassId].sheetId;
    return Promise.all([
      jsonpFetch(sheetId, 'Qualifs').then(function(resp){ if (gen === activeGen) qualifsRows = parseQualifs(resp); }),
      jsonpFetch(sheetId, 'scoring').then(function(resp){
        if (gen === activeGen){
          scoringRows = parseScoringRows(resp);
          scoringMap = buildScoringMap(scoringRows);
        }
      }),
      jsonpFetch(sheetId, 'Top16', 0).then(function(resp){
        if (gen === activeGen) top16Rows = parseTop16(resp);
      }).catch(function(){
        if (gen === activeGen && top16Rows === null) top16Rows = false;
      }),
      jsonpFetch(sheetId, 'Ordre qualif run #2').then(function(resp){
        if (gen === activeGen) lcqRows = parseLcq(resp);
      }).catch(function(){
        if (gen === activeGen && lcqRows === null) lcqRows = [];
      }),
      // Indépendant de la classe Pro/Pro-Am sélectionnée — un seul pilote en piste à la fois.
      jsonpFetch(LIVE_SHEET_ID, LIVE_SHEET_TAB, 1).then(function(resp){
        onTrack = parseOnTrack(resp);
      }).catch(function(){
        if (onTrack === null) onTrack = false;
      }),
      jsonpFetch(LIVE_SHEET_ID, 'battle', 1).then(function(resp){
        battleInfo = parseBattle(resp);
      }).catch(function(){
        if (battleInfo === null) battleInfo = false;
      }),
      jsonpFetch(LIVE_SHEET_ID, 'Stats', 1).then(function(resp){
        statsData = parseStatsData(resp);
        statsByNum = buildStatsByNum(statsData);
      }).catch(function(){
        if (statsData === null){ statsData = []; statsByNum = {}; }
      }),
      jsonpFetch(LIVE_SHEET_ID, 'site', 1).then(function(resp){
        sponsorsByNum = parseSiteSponsors(resp);
      }).catch(function(){
        if (sponsorsByNum === null) sponsorsByNum = {};
      })
    ]).then(function(){
      if (gen !== activeGen) return;
      setLive(true);
      stampSync();
      render();
    }).catch(function(){
      if (gen === activeGen) setLive(false);
    });
  }

  function loop(){
    var gen = activeGen;
    pollOnce().finally(function(){
      if (gen === activeGen) pollTimer = setTimeout(loop, POLL_MS);
    });
  }

  function writeHash(){
    var h = '#' + currentClassId + '-' + currentViewId;
    if (location.hash !== h) location.hash = h;
  }

  function updateSwitchUI(){
    var classBtns = document.querySelectorAll('#classSwitch .switch-btn');
    for (var i = 0; i < classBtns.length; i++){
      classBtns[i].classList.toggle('active', classBtns[i].getAttribute('data-class') === currentClassId);
    }
    var viewBtns = document.querySelectorAll('#viewSwitch .switch-btn');
    for (var j = 0; j < viewBtns.length; j++){
      viewBtns[j].classList.toggle('active', viewBtns[j].getAttribute('data-view') === currentViewId);
    }
    document.getElementById('contextLabel').innerHTML =
      '<strong>' + CLASSES[currentClassId].eyebrow + '</strong> · ' + VIEWS[currentViewId].label;
    document.getElementById('footerSource').textContent =
      (currentViewId === 'scoring')  ? 'Source : feuille « scoring » — Google Sheets' :
      (currentViewId === 'top16')    ? 'Source : feuille « Top16 » — Google Sheets' :
      (currentViewId === 'lcq')      ? 'Source : feuille « Ordre qualif run #2 » — Google Sheets' :
      (currentViewId === 'sponsors') ? 'Source : feuilles « qualifs », « battle », « Stats » & « site » — Google Sheets' :
      'Source : feuilles « Qualifs » & « scoring » — Google Sheets';
    document.getElementById('classSelect').value = currentClassId;
    document.getElementById('viewSelect').value = currentViewId;
  }

  // Dropdowns mobile (mêmes options que les boutons, pour libérer de la hauteur en tête de page)
  function initNavSelects(){
    var classSelect = document.getElementById('classSelect');
    var viewSelect = document.getElementById('viewSelect');
    var chtml = '';
    for (var cid in CLASSES){ chtml += '<option value="' + cid + '">' + CLASSES[cid].label + '</option>'; }
    classSelect.innerHTML = chtml;
    var vhtml = '';
    for (var vid in VIEWS){ vhtml += '<option value="' + vid + '">' + VIEWS[vid].label + '</option>'; }
    viewSelect.innerHTML = vhtml;
    classSelect.addEventListener('change', function(){ switchClass(this.value); });
    viewSelect.addEventListener('change', function(){ switchView(this.value); });
  }

  function switchClass(id){
    if (!CLASSES[id]) return;
    if (id === currentClassId){ updateSwitchUI(); return; }
    currentClassId = id;
    activeGen += 1;
    qualifsRows = null;
    scoringRows = null;
    scoringMap = null;
    top16Rows = null;
    lcqRows = null;
    prevQuali = {};
    prevScoring = {};
    prevTop16 = {};
    prevLcq = {};
    if (pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
    updateSwitchUI();
    render();
    writeHash();
    loop();
  }

  function switchView(id){
    if (!VIEWS[id]) return;
    if (id === currentViewId){ updateSwitchUI(); return; }
    currentViewId = id;
    updateSwitchUI();
    render();
    writeHash();
  }

  document.getElementById('classSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('.switch-btn');
    if (!btn) return;
    switchClass(btn.getAttribute('data-class'));
  });

  document.getElementById('viewSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('.switch-btn');
    if (!btn) return;
    switchView(btn.getAttribute('data-view'));
  });

  document.getElementById('sponsorModeSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('.switch-btn');
    if (!btn) return;
    currentSponsorMode = btn.getAttribute('data-mode');
    var btns = document.querySelectorAll('#sponsorModeSwitch .switch-btn');
    for (var i = 0; i < btns.length; i++){ btns[i].classList.toggle('active', btns[i] === btn); }
    renderSponsorCard();
  });

  window.addEventListener('hashchange', function(){
    var parsed = parseHash();
    if (parsed.cls !== currentClassId) switchClass(parsed.cls);
    if (parsed.view !== currentViewId) switchView(parsed.view);
  });

  initNavSelects();
  updateSwitchUI();
  loop();
})();
</script>
</body>
</html>
